<!DOCTYPE html>
<html lang="fo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vínleiðarin · Rúsan</title>
<style>
:root{
  --bg:#f2f2f7; --bg2:#ffffff; --card:#ffffff;
  --label:#1d1d1f; --label2:#6b6b70; --label3:#a1a1a6;
  --sep:rgba(60,60,67,.10);
  --tint:#a4243b; --tint-press:#8c1d31; --tint-soft:rgba(164,36,59,.10);
  --glass:rgba(255,255,255,.72); --glass-brd:rgba(255,255,255,.5);
  --shadow:0 10px 40px -12px rgba(0,0,0,.18);
  --gold:#c8a24a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0a0b; --bg2:#1c1c1e; --card:#1c1c1e;
    --label:#f5f5f7; --label2:#a1a1a6; --label3:#6b6b70;
    --sep:rgba(255,255,255,.10);
    --tint:#ff5a6e; --tint-press:#e04358; --tint-soft:rgba(255,90,110,.14);
    --glass:rgba(28,28,30,.62); --glass-brd:rgba(255,255,255,.08);
    --shadow:0 10px 40px -10px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--label);
  font-family:-apple-system,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh;
}
.app{max-width:480px; margin:0 auto; min-height:100vh; position:relative;
  padding-bottom:env(safe-area-inset-bottom);}

/* ---------- Liquid Glass top nav ---------- */
.nav{position:sticky; top:0; z-index:30; height:52px; display:flex; align-items:center;
  gap:12px; padding:0 16px;
  background:var(--glass); backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--sep);
  box-shadow:inset 0 1px 0 0 rgba(255,255,255,.4);}
@media (prefers-color-scheme: dark){.nav{box-shadow:inset 0 1px 0 0 rgba(255,255,255,.05)}}
.nav.hidden{display:none}
.back{width:34px;height:34px;border:none;background:var(--tint-soft);color:var(--tint);
  border-radius:50%; font-size:19px; cursor:pointer; display:grid;place-items:center;
  transition:transform .15s, background .15s; flex:none}
.back:active{transform:scale(.9)}
.progress{flex:1; display:flex; gap:5px}
.seg{flex:1;height:4px;border-radius:2px;background:var(--sep);overflow:hidden}
.seg .fill{display:block;height:100%;width:0;background:var(--tint);border-radius:2px;
  transition:width .4s cubic-bezier(.32,.72,0,1)}
.seg.done .fill{width:100%}
.seg.active .fill{width:100%}
.navlbl{font-size:13px;color:var(--label2);font-weight:500;flex:none;min-width:34px;text-align:right}

/* ---------- screens ---------- */
.screen{padding:8px 20px 140px; animation:rise .42s cubic-bezier(.32,.72,0,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .screen{animation:fade .2s both} @keyframes fade{from{opacity:0}to{opacity:1}}
  .seg .fill{transition:none}
}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--tint);
  text-transform:uppercase;margin:18px 0 6px}
h1{font-size:33px;line-height:1.07;font-weight:700;letter-spacing:-.02em;margin:0 0 10px}
.sub{font-size:17px;line-height:1.4;color:var(--label2);margin:0 0 8px;max-width:34ch}

/* intro */
.hero-mark{width:64px;height:64px;border-radius:18px;margin:34px 0 8px;
  background:linear-gradient(160deg,#c0394f,#7b1f2b);
  display:grid;place-items:center;font-size:32px;
  box-shadow:0 14px 30px -10px rgba(164,36,59,.6), inset 0 1px 0 rgba(255,255,255,.4)}
.stats{display:flex;gap:10px;margin:26px 0 0;flex-wrap:wrap}
.stat{background:var(--card);border-radius:16px;padding:14px 16px;flex:1;min-width:96px;
  box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-.01em}
.stat span{font-size:13px;color:var(--label2)}

/* option grid (slag, matur) */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px}
.tile{position:relative;background:var(--card);border:1.5px solid transparent;border-radius:18px;
  padding:16px 14px;text-align:left;cursor:pointer;font-family:inherit;color:var(--label);
  box-shadow:var(--shadow);transition:transform .12s, border-color .15s;display:flex;
  flex-direction:column;gap:9px;min-height:84px}
.tile:active{transform:scale(.97)}
.tile.on{border-color:var(--tint);background:var(--tint-soft)}
.tile .glyph{font-size:24px;line-height:1}
.tile .dot{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.tile .tlabel{font-size:16px;font-weight:600;letter-spacing:-.01em}
.tile .tdesc{font-size:12.5px;color:var(--label2);margin-top:-4px}
.tile .check{position:absolute;top:12px;right:12px;width:21px;height:21px;border-radius:50%;
  background:var(--tint);color:#fff;display:none;place-items:center;font-size:13px}
.tile.on .check{display:grid}

/* list rows (fylla, søtleiki, prísur) */
.list{margin-top:18px;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;
  border-bottom:1px solid var(--sep);transition:background .12s}
.row:last-child{border-bottom:none}
.row:active{background:var(--tint-soft)}
.row .rlabel{flex:1;font-size:17px;font-weight:500}
.row .rdesc{font-size:13px;color:var(--label2);font-weight:400}
.row .tick{width:23px;height:23px;border-radius:50%;border:2px solid var(--sep);flex:none}
.row.on .tick{border-color:var(--tint);background:var(--tint);position:relative}
.row.on .tick::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;
  color:#fff;font-size:13px}
.bars{display:flex;gap:3px;align-items:flex-end;height:18px}
.bars i{width:5px;background:var(--label3);border-radius:1px;display:block}
.row.on .bars i{background:var(--tint)}

/* ---------- results ---------- */
.rcount{font-size:15px;color:var(--label2);margin:6px 0 16px}
.wine{background:var(--card);border-radius:22px;padding:16px;margin-bottom:13px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.wine.top{border:1.5px solid var(--tint)}
.topbadge{position:absolute;top:0;left:0;background:var(--tint);color:#fff;font-size:11px;
  font-weight:600;letter-spacing:.03em;padding:5px 14px;border-bottom-right-radius:14px}
.wtop{display:flex;gap:15px;align-items:flex-start;margin-top:2px}
.bottle{width:56px;height:84px;flex:none;background:#fff;border-radius:10px;display:grid;
  place-items:center;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.bottle img{max-width:90%;max-height:90%;object-fit:contain;mix-blend-mode:multiply}
.whead{flex:1;min-width:0}
.match{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.match .pct{font-size:13px;font-weight:700;color:var(--tint)}
.match .meter{flex:1;height:5px;background:var(--sep);border-radius:3px;overflow:hidden;max-width:120px}
.match .meter i{display:block;height:100%;background:var(--tint);border-radius:3px}
.wname{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.12;margin:0 0 3px;
  color:var(--label);text-decoration:none;display:block}
.worigin{font-size:13px;color:var(--label2)}
.wtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.t{font-size:12px;font-weight:500;padding:4px 9px;border-radius:8px;background:var(--bg);color:var(--label2)}
.t.af{background:#e8f3ec;color:#2e7d4f}
@media(prefers-color-scheme:dark){.t.af{background:rgba(46,125,79,.2);color:#7fd6a0}}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.reason{font-size:12.5px;font-weight:500;padding:5px 10px;border-radius:9px;
  background:var(--tint-soft);color:var(--tint);display:flex;align-items:center;gap:5px}
.reason.soft{background:var(--bg);color:var(--label2)}
.wnotes{font-size:14px;line-height:1.45;color:var(--label2);margin:12px 0 0}
.wfoot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;
  padding-top:13px;border-top:1px solid var(--sep)}
.wprice{font-size:19px;font-weight:700;letter-spacing:-.01em}
.wprice s{font-size:12px;font-weight:500;color:var(--label2);text-decoration:none}
.rating{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--label2)}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px}
.wlink{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;
  color:var(--tint);text-decoration:none}
.empty{text-align:center;padding:60px 24px;color:var(--label2)}
.empty .e-ic{font-size:42px;margin-bottom:8px}

.info{margin-top:22px;padding:16px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);
  font-size:12.5px;line-height:1.6;color:var(--label2)}
.info b{color:var(--label)}
.info .lg{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* ---------- Liquid Glass bottom action ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:14px 20px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,var(--bg) 30%,transparent);display:none}
.dock.show{display:block}
.app:has(.screen) .dock{max-width:480px;margin:0 auto}
.btn{width:100%;border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:transform .12s, opacity .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--tint);color:#fff;box-shadow:0 8px 24px -8px var(--tint)}
.btn.primary:disabled{opacity:.4;box-shadow:none}
.btn.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--tint);
  border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 20px -8px rgba(0,0,0,.2)}
.center{text-align:center}
.restart{display:block;margin:8px auto 0;background:none;border:none;color:var(--label2);
  font-size:15px;font-family:inherit;cursor:pointer;padding:8px}
</style>
</head>

 {key:"fylla",title:"Hvussu kraftigt?",sub:"Frá lættum og frísku til kraftmikið og fylt.",
  opts:[{v:1,l:"Lætt",d:"Mjúkt og leskiligt",bars:1},{v:2,l:"Miðal",d:"Væl javnvigað",bars:2},
        {v:3,l:"Kraftigt",d:"Fylt og intenst",bars:3},{v:"any",l:"Sama mær",d:"Eingin fyrimunur"}]},
 {key:"sott",title:"Turt ella søtt?",sub:"",
  opts:[{v:"turt",l:"Turt",d:"Lítil ella eingin søtleiki"},{v:"halvturt",l:"Hálvturt",d:"Eitt sindur av søtleika"},
        {v:"sott",l:"Søtt",d:"Greiður søtleiki"},{v:"any",l:"Sama mær",d:"Eingin fyrimunur"}]},
 {key:"pris",title:"Hvat má tað kosta?",sub:"Prísur við MVG, fyri eina fløsku.",
  opts:[{v:"a",l:"Undir 100 kr",d:"Hvørsdagsvín",lo:0,hi:100},{v:"b",l:"100–200 kr",d:"Miðallag",lo:100,hi:200},
        {v:"c",l:"Yvir 200 kr",d:"Til serlig høvi",lo:200,hi:99999},{v:"any",l:"Sama mær",d:"Eingin mark"}]}
];

let step=0; // 0=intro, 1..5 = Q index+1, 6=results
const A={slag:null,matur:null,fylla:null,sott:null,pris:null};
const main=document.getElementById('main'),nav=document.getElementById('nav'),dock=document.getElementById('dock'),
 prog=document.getElementById('prog'),navlbl=document.getElementById('navlbl'),back=document.getElementById('back');

back.onclick=()=>{ if(step>0){step--; render();} };

function render(){
  // nav + progress
  if(step>=1 && step<=Q.length){
    nav.classList.remove('hidden');
    prog.innerHTML=Q.map((_,i)=>`<div class="seg ${i<step-1?'done':''} ${i===step-1?'active':''}"><span class="fill"></span></div>`).join('');
    navlbl.textContent=step+" / "+Q.length;
  } else nav.classList.add('hidden');

  if(step===0) renderIntro();
  else if(step<=Q.length) renderQ(step-1);
  else renderResults();
  window.scrollTo({top:0,behavior:'instant'});
}

function renderIntro(){
  dock.className='dock show';
  dock.innerHTML=`<button class="btn primary" onclick="next()">Byrja</button>`;
  main.innerHTML=`<section class="screen">
    <div class="hero-mark">🍷</div>
    <div class="eyebrow">Rúsan · prototýpa</div>
    <h1>Vínleiðarin</h1>
    <p class="sub">Svara nøkrum spurningum um mat og smakk. So finna vit vínini úr Rúsans skrá, ið hóska best.</p>
    <div class="stats">
      <div class="stat"><b>${W.length}</b><span>verulig vín</span></div>
      <div class="stat"><b>${Object.keys(C).length}</b><span>lond</span></div>
      <div class="stat"><b>5</b><span>spurningar</span></div>
    </div>
  </section>`;
}

function renderQ(i){
  const q=Q[i], cur=A[q.key];
  let body;
  if(q.grid){
    body=`<div class="grid">`+q.opts.map(o=>{
      const lab=o.l||FOOD[o.v][1];
      const gl=q.emoji?`<div class="glyph">${o.glyph||FOOD[o.v][0]}</div>`
        :(o.color==="any"?`<div class="dot" style="background:conic-gradient(from 0deg,#7b1f2b,#e4cf7a,#d97b29,#7b1f2b)"></div>`
          :`<div class="dot" style="background:${o.color}"></div>`);
      return `<button class="tile ${cur===o.v?'on':''}" onclick="pick('${q.key}','${o.v}')">
        <span class="check">✓</span>${gl}<span class="tlabel">${lab}</span></button>`;
    }).join('')+`</div>`;
  } else {
    body=`<div class="list">`+q.opts.map(o=>{
      const bars=o.bars?`<span class="bars">${[8,13,18].slice(0,3).map((h,bi)=>`<i style="height:${bi<o.bars?h:6}px;opacity:${bi<o.bars?1:.4}"></i>`).join('')}</span>`:'';
      return `<div class="row ${cur===String(o.v)||cur===o.v?'on':''}" onclick="pick('${q.key}','${o.v}')">
        ${bars}<div><div class="rlabel">${o.l}</div>${o.d?`<div class="rdesc">${o.d}</div>`:''}</div>
        <span class="tick"></span></div>`;
    }).join('')+`</div>`;
  }
  main.innerHTML=`<section class="screen">
    <div class="eyebrow">Spurningur ${i+1}</div>
    <h1>${q.title}</h1>${q.sub?`<p class="sub">${q.sub}</p>`:''}${body}</section>`;
  dock.className='dock'+(cur!=null?' show':'');
  dock.innerHTML= i===Q.length-1
    ? `<button class="btn primary" ${cur==null?'disabled':''} onclick="next()">Vís úrslitini</button>`
    : `<button class="btn glass" ${cur==null?'disabled':''} onclick="next()">Hald fram</button>`;
}

function pick(key,val){
  A[key]= (val==='1'||val==='2'||val==='3')? val : val;
  render();
  // auto-advance on select (snappy quiz feel)
  clearTimeout(window._adv);
  window._adv=setTimeout(()=>{ if(step>=1&&step<=Q.length) next(); }, 260);
}
function next(){ step++; render(); }

/* ===================== MATCHING ===================== */
function priceRange(){const o=Q[4].opts.find(o=>o.v===A.pris);return o&&o.lo!=null?[o.lo,o.hi]:null;}
function passType(w){
  if(!A.slag||A.slag==='any') return true;
  if(A.slag==='sweet') return w.k==='sweet'||w.s==='sott';
  return w.k===A.slag;
}
function adj(a,b){const o=['turt','halvturt','sott'];return Math.abs(o.indexOf(a)-o.indexOf(b))===1;}

function scoreWine(w){
  let s=0,max=0;const reasons=[];
  if(A.matur&&A.matur!=='none'){
    max+=50;
    if(w.pr.includes(A.matur)){s+=50;reasons.push({t:"Hóskar til "+FOOD[A.matur][1],ic:FOOD[A.matur][0]});}
    else if(w.dv.includes(A.matur)){s+=32;reasons.push({t:"Nevnt til "+FOOD[A.matur][1]+" í lýsing",ic:FOOD[A.matur][0],soft:1});}
  }
  if(A.fylla&&A.fylla!=='any'){const pf=+A.fylla;max+=18;const d=Math.abs(w.b-pf);
    if(d===0){s+=18;reasons.push({t:BODY[pf]+" fylla",soft:1});}else if(d===1)s+=9;}
  if(A.sott&&A.sott!=='any'){max+=18;
    if(w.s===A.sott){s+=18;reasons.push({t:SWEET[A.sott],soft:1});}else if(adj(w.s,A.sott))s+=6;}
  max+=10; s+=(w.r/5)*10;
  const pct=max>0?Math.round(s/max*100):Math.round(w.r/5*100);
  return {pct:Math.min(99,pct),raw:s,reasons};
}

function renderResults(){
  dock.className='dock';dock.innerHTML='';
  const pr=priceRange();
  let list=W.filter(w=>passType(w)&&(!pr||(w.p>=pr[0]&&w.p<pr[1])))
            .map(w=>({w,...scoreWine(w)}))
            .sort((a,b)=>b.raw-a.raw);
  const head=`<section class="screen">
    <div class="eyebrow">Tínar samsvaringar</div>
    <h1>${list.length?(A.matur&&A.matur!=='none'?'Best til '+FOOD[A.matur][1]:'Mælt til tín'):'Eingin púra samsvar'}</h1>`;
  if(!list.length){
    main.innerHTML=head+`<div class="empty"><div class="e-ic">🍇</div>
      <p>Ongin vín svaraðu til øll vølini. Royn eitt breiðari úrval.</p></div>
      </section>`;
    dock.className='dock show';
    dock.innerHTML=`<button class="btn primary" onclick="restart()">Byrja av nýggjum</button>`;
    return;
  }
  const cards=list.slice(0,12).map((m,idx)=>{
    const w=m.w, ct=C[w.c];
    const tags=[`<span class="t">${w.t}</span>`,`<span class="t">${BODY[w.b]}</span>`,`<span class="t">${SWEET[w.s]}</span>`]
      .concat(w.af?[`<span class="t af">Alkoholfrítt</span>`]:[])
      .concat(flav(w.no).map(f=>`<span class="t">${f}</span>`)).join('');
    const reasons=m.reasons.map(r=>`<span class="reason ${r.soft?'soft':''}">${r.ic?r.ic+' ':''}${r.t}</span>`).join('');
    const full=Math.round(w.r);const stars='★'.repeat(full)+'☆'.repeat(5-full);
    return `<article class="wine ${idx===0?'top':''}">
      ${idx===0?'<div class="topbadge">Tín besta samsvaring</div>':''}
      <div class="wtop" ${idx===0?'style="margin-top:18px"':''}>
        <div class="bottle"><img loading="lazy" src="https://rusan.fo/Images/Items/W50/${w.im}.jpg" alt="" onerror="this.parentNode.style.display='none'"></div>
        <div class="whead">
          <div class="match"><span class="pct">${m.pct}% samsvar</span>
            <span class="meter"><i style="width:${m.pct}%"></i></span></div>
          <a class="wname" href="https://rusan.fo/ShopItem/VIN/0/${w.id}/STK" target="_blank" rel="noopener">${w.n}</a>
          <div class="worigin">${ct[0]} ${ct[1]} · ${w.a}% · ${w.v}</div>
        </div>
      </div>
      ${reasons?`<div class="reasons">${reasons}</div>`:''}
      <div class="wtags">${tags}</div>
      <p class="wnotes">${w.no}</p>
      <div class="wfoot">
        <div><div class="wprice">${w.p.toLocaleString('da-DK',{minimumFractionDigits:2})} <s>kr</s></div>
          <div class="rating"><span class="stars">${stars}</span> ${w.r.toFixed(1)} · ${w.vo} metingar</div></div>
        <a class="wlink" href="https://rusan.fo/ShopItem/VIN/0/${w.id}/STK" target="_blank" rel="noopener">Hjá Rúsan ›</a>
      </div>
    </article>`;
  }).join('');
  main.innerHTML=head+`<div class="rcount">${list.length} vín svara til tíni vøl — víst eftir samsvari</div>
    ${cards}
    <div class="info">
      <b>Hvussu hetta riggar.</b><br>
      <span class="lg" style="background:#a4243b"></span><b>Rúsans dátur:</b> navn, mynd, prísur, styrki, land, lýsing og matmerki — ${W.length} verulig vín tikin frá rusan.fo (royndarúrtak av skránni).<br>
      <span class="lg" style="background:#c8a24a"></span><b>Okkara profilur (demo):</b> slag, fylla, søtleiki og smakkmerki, loyst úr lýsingunum.<br>
      <span class="lg" style="background:#6b6b70"></span><b>Metingar (demo):</b> har tínar login-leysu metingar fóðra inn.
    </div>
    </section>`;
  dock.className='dock show';
  dock.innerHTML=`<button class="btn glass" onclick="restart()">Royn av nýggjum</button>`;
}

function restart(){step=0;A.slag=A.matur=A.fylla=A.sott=A.pris=null;render();}

render();
</script>
</body>
</html>
