<!DOCTYPE html>
<html lang="fo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smakkhjálpin · Rúsan</title>

<!-- The full catalogue. Keep wines.js in the same folder; the app uses it automatically. -->
<script src="wines.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:where(:root){--display:'Plus Jakarta Sans',system-ui,sans-serif}

:root{
  color-scheme: light;
  --paper:oklch(0.967 0.013 83);
  --paper-2:oklch(0.942 0.016 83);
  --surface:oklch(0.996 0.005 83);
  --navy:oklch(0.34 0.087 264);
  --navy-press:oklch(0.28 0.09 264);
  --ink:oklch(0.33 0.04 264);
  --muted:oklch(0.54 0.03 264);
  --faint:oklch(0.70 0.02 264);
  --line:oklch(0.90 0.012 83);
  --lav:oklch(0.885 0.045 268);
  --lav-press:oklch(0.83 0.06 268);
  --clay:oklch(0.60 0.13 33);
  --amber:oklch(0.74 0.10 78);
  --on-navy:oklch(0.975 0.012 83);
  --shadow:0 5px 22px -12px oklch(0.34 0.06 264 / 0.22);
  --shadow-sm:0 2px 10px -6px oklch(0.34 0.06 264 / 0.20);
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--display); font-weight:400; line-height:1.5;
  -webkit-font-smoothing:antialiased; min-height:100%;
}
.app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}

/* progress + top bar */
.track{height:4px;background:var(--paper-2);position:sticky;top:0;z-index:30}
.track .fill{height:100%;background:var(--navy);width:0;border-radius:0 3px 3px 0;transition:width .55s var(--ease)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 4px;gap:12px}
.brandmark{font-family:var(--display);font-weight:800;font-size:17px;color:var(--navy);letter-spacing:-.02em;
  display:flex;align-items:center;gap:8px}
.brandmark .glass{font-size:16px}
.step-ix{font-size:13px;color:var(--muted);font-weight:500}
.iconbtn{width:38px;height:38px;border:none;background:transparent;color:var(--navy);border-radius:50%;
  cursor:pointer;display:grid;place-items:center;font-size:19px;transition:background .15s,transform .12s}
.iconbtn:hover{background:var(--paper-2)} .iconbtn:active{transform:scale(.9)}
.topbar-actions{display:flex;align-items:center;gap:2px}
.favpill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px;border:1px solid var(--line);
  background:var(--surface);border-radius:19px;color:var(--navy);font-family:inherit;font-size:14px;font-weight:600;
  cursor:pointer;transition:transform .12s} .favpill:active{transform:scale(.95)}
.favpill .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--clay);color:var(--on-navy);
  font-size:11px;font-weight:700;display:grid;place-items:center}

/* screen */
.screen{flex:1;padding:10px 22px 132px;animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:fade .2s both}@keyframes fade{from{opacity:0}to{opacity:1}}
  .track .fill{transition:none}}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--clay);margin:18px 0 9px}
h1{font-family:var(--display);font-weight:800;font-size:31px;line-height:1.08;letter-spacing:-.03em;color:var(--navy)}
.q-sub{font-size:16px;color:var(--muted);margin-top:9px;max-width:32ch}
.help-line{margin-top:12px;padding:12px 15px;background:var(--lav);border-radius:14px;font-size:14px;
  color:var(--navy);line-height:1.45;display:none}
.help-line.show{display:block;animation:rise .35s var(--ease) both}

/* big option buttons (reference look) */
.opts{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.opt{position:relative;width:100%;border:none;cursor:pointer;font-family:inherit;text-align:left;
  background:var(--lav);color:var(--navy);border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:14px;
  transition:transform .12s var(--ease),background .15s,box-shadow .15s}
.opt:hover{box-shadow:var(--shadow-sm)} .opt:active{transform:scale(.985)}
.opt.on{background:var(--navy);color:var(--on-navy);box-shadow:var(--shadow)}
.opt .lab{font-size:17px;font-weight:600;letter-spacing:-.01em}
.opt .desc{font-size:13.5px;color:var(--muted);font-weight:400;margin-top:2px}
.opt.on .desc{color:oklch(0.85 0.03 264)}
.opt .tick{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid oklch(0.5 0.06 268 / .4);flex:none;
  display:grid;place-items:center;font-size:14px;color:transparent}
.opt.on .tick{background:var(--on-navy);border-color:var(--on-navy);color:var(--navy)}
.opt .swatch{width:26px;height:26px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1px oklch(0 0 0 / .08)}
.opt .col{display:flex;flex-direction:column}

/* compact grid for food + flavours */
.grid{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cell{position:relative;border:none;cursor:pointer;font-family:inherit;background:var(--surface);color:var(--navy);
  border:1px solid var(--line);border-radius:16px;padding:15px 14px;display:flex;align-items:center;gap:11px;
  font-size:15px;font-weight:600;transition:transform .12s var(--ease),background .15s,border-color .15s}
.cell:active{transform:scale(.97)} .cell .gl{font-size:21px}
.cell.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.cell .mini{position:absolute;top:9px;right:10px;width:18px;height:18px;border-radius:50%;background:var(--on-navy);
  color:var(--navy);font-size:11px;display:none;place-items:center}
.cell.on .mini{display:grid}
.multi-hint{margin-top:14px;font-size:13px;color:var(--faint)}

/* bottom action bar */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(0deg,var(--paper) 62%,transparent);
  padding:14px 22px calc(16px + env(safe-area-inset-bottom));display:none}
.actions.show{display:block}
.actions .row{max-width:460px;margin:0 auto;display:flex;align-items:center;gap:14px}
.linkbtn{background:none;border:none;font-family:inherit;font-size:15px;font-weight:600;color:var(--navy);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;padding:8px 2px;white-space:nowrap}
.linkbtn:disabled{color:var(--faint);text-decoration:none;cursor:default}
.cta{flex:1;border:none;cursor:pointer;font-family:inherit;background:var(--navy);color:var(--on-navy);
  border-radius:999px;padding:15px;font-size:16px;font-weight:600;box-shadow:var(--shadow);transition:transform .12s,background .15s}
.cta:active{transform:scale(.98)} .cta:hover{background:var(--navy-press)}
.cta.full{flex:none;width:100%}

/* intro */
.hero{margin-top:30px}
.crest{width:62px;height:62px;border-radius:16px;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:27px;box-shadow:var(--shadow);margin-bottom:18px}
.intro-title{font-size:42px;line-height:1.02}
.intro-sub{font-size:17px;color:var(--muted);margin-top:12px;max-width:30ch}
.facts{display:flex;gap:22px;margin-top:30px}
.fact b{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;color:var(--navy);display:block}
.fact span{font-size:13px;color:var(--muted)}
.demo-note{margin-top:22px;font-size:13px;color:var(--clay);background:oklch(0.6 0.13 33 / .10);padding:11px 14px;border-radius:12px;display:none}
.demo-note.show{display:block}

/* results */
.profile{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 6px}
.pchip{font-size:13px;font-weight:600;color:var(--navy);background:var(--lav);padding:6px 12px;border-radius:9px}
.rcount{font-size:14px;color:var(--muted);margin:14px 0 16px}
.wine{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:13px;
  box-shadow:var(--shadow-sm);position:relative}
.wine.best{border-color:var(--navy);box-shadow:var(--shadow)}
.best-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--on-navy);background:var(--navy);padding:4px 11px;border-radius:8px;margin-bottom:12px}
.heart{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--paper);color:var(--faint);font-size:17px;cursor:pointer;display:grid;place-items:center;
  transition:transform .14s,color .15s,background .15s,border-color .15s}
.heart:active{transform:scale(.84)} .heart.on{color:var(--on-navy);background:var(--clay);border-color:var(--clay)}
.wtop{display:flex;gap:15px;padding-right:40px}
.bottle{width:54px;height:82px;flex:none;background:#fff;border-radius:9px;display:grid;place-items:center;overflow:hidden;
  border:1px solid var(--line)}
.bottle img{max-width:88%;max-height:88%;object-fit:contain;mix-blend-mode:multiply}
.match{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.match .pct{font-size:13px;font-weight:700;color:var(--navy)}
.match .meter{flex:1;max-width:120px;height:5px;background:var(--paper-2);border-radius:3px;overflow:hidden}
.match .meter i{display:block;height:100%;background:var(--navy);border-radius:3px}
.wname{font-family:var(--display);font-size:17px;font-weight:700;line-height:1.16;letter-spacing:-.01em;color:var(--navy);
  text-decoration:none;display:block} .wname:hover{text-decoration:underline}
.worigin{font-size:13px;color:var(--muted);margin-top:3px}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.reason{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:9px;background:var(--lav);color:var(--navy);
  display:flex;align-items:center;gap:5px}
.reason.soft{background:var(--paper-2);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;font-weight:500;padding:4px 9px;border-radius:8px;background:var(--paper-2);color:var(--muted)}
.wbar{display:flex;align-items:center;justify-content:space-between;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.price{font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.01em;color:var(--navy)}
.price s{font-size:11px;color:var(--muted);text-decoration:none;font-weight:500}
.sortbar{display:flex;gap:8px;margin:2px 0 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
.sortbar::-webkit-scrollbar{display:none}
.sortpill{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:inherit;
  font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:transform .12s,background .15s,color .15s,border-color .15s}
.sortpill:active{transform:scale(.96)}
.sortpill.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.stars{color:var(--amber);font-size:13px;letter-spacing:1px}
.rate{font-size:12.5px;color:var(--muted);text-align:right}
.refine{display:flex;gap:8px;margin-top:12px}
.rbtn{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--navy);font-family:inherit;font-size:13.5px;
  font-weight:600;border-radius:11px;padding:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .12s,background .15s} .rbtn:active{transform:scale(.97)}
.rbtn.up:hover{background:var(--lav)} .rbtn.down:hover{background:var(--paper-2)}
.rbtn .x{font-size:15px}
.more{margin-top:11px;font-size:13.5px;font-weight:600;color:var(--navy);background:none;border:none;cursor:pointer;
  font-family:inherit;text-decoration:underline;text-underline-offset:3px;padding:2px}
.detail{display:none;margin-top:12px;padding-top:13px;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
.detail.open{display:block;animation:rise .3s var(--ease) both}
.detail p{color:var(--ink)} .detail .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:13px 0 6px}
.pair-row{display:flex;flex-wrap:wrap;gap:8px}
.pair{font-size:13px;display:inline-flex;align-items:center;gap:6px;background:var(--paper-2);padding:5px 10px;border-radius:9px;color:var(--ink)}
.pair.d{opacity:.65}
.shoplink{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:14px;font-weight:600;color:var(--navy);
  text-decoration:none;background:var(--lav);padding:10px 16px;border-radius:11px;transition:transform .12s} .shoplink:active{transform:scale(.97)}

/* favourites */
.favhead{display:flex;align-items:center;gap:12px;margin:16px 0 2px}
.favcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;
  position:relative;box-shadow:var(--shadow-sm)}
.favmsg{font-size:13.5px;color:var(--clay);font-weight:600;margin-top:11px}
.notelbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:13px 0 6px}
.note{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-family:inherit;
  font-size:14px;padding:11px 13px;resize:none;line-height:1.45} .note:focus{outline:none;border-color:var(--navy)}
.empty{text-align:center;padding:64px 22px;color:var(--muted)} .empty .e-ic{font-size:46px;margin-bottom:12px}

.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(12px);z-index:60;max-width:320px;
  padding:13px 19px;border-radius:15px;background:var(--navy);color:var(--on-navy);font-size:14.5px;font-weight:500;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="topbar" id="topbar"></div>
  <main id="main"></main>
  <div class="actions" id="actions"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================
   Smakkhjálpin — taste guide for wines available at rusan.fo.
   Real data (name, image, price, ABV, country, notes, food icons)
   comes from wines.js (window.RUSAN_WINES, generated once by harvest.mjs).
   Fictive/derived data (type, body, sweetness, flavour tags, rating)
   travels with it. A small fallback runs if wines.js is absent.
   ============================================================ */

const FALLBACK=[
 {id:"01-905120",im:2162,n:"Alamos Malbec",c:"AR",t:"Reyðvín",k:"red",b:3,s:"turt",a:13.5,v:"0,75 l",p:97,pr:["flogfenadur","lambskjot","neytakjot","ostur","villinidjor"],dv:[],r:4.4,vo:96,no:"Kraftigur royktur angi. Bleytur smakkur við frukt og krydd. Hóskar til lambs- og neytakjøt, villini djór og búnan ost."},
 {id:"02-905120",im:1551,n:"Alamos Chardonnay",c:"AR",t:"Hvítvín",k:"white",b:2,s:"turt",a:13.5,v:"0,75 l",p:97,pr:["fiskur","flogfenadur","svinakjot"],dv:[],r:4.0,vo:42,no:"Bleytur kryddaður fruktsmakkur við nakað av eik. Hóskar til feitan fisk og lættar kjøtrættir."},
 {id:"04-407114",im:2984,n:"Abbazia Moscato Rosé",c:"IT",t:"Brúsandi rósuvín",k:"sparkling",b:1,s:"sott",a:7,v:"0,75 l",p:81,pr:["dessertir","fordrykkir"],dv:[],r:4.3,vo:38,no:"Søtt brúsandi vín við frískari frukt og rósum. Hóskar til dessert og sum fordrykkur."},
 {id:"01-402189",im:3971,n:"Amarone Colognola",c:"IT",t:"Reyðvín",k:"red",b:3,s:"turt",a:15,v:"0,75 l",p:234.5,pr:["lambskjot","ostur","villinidjor"],dv:[],r:4.6,vo:34,no:"Bleytur, rundur fruktsmakkur við góðari fyllu og langum ráka. Hóskar til grillaðar kjøtrættir og búnan ost."},
 {id:"02-304216",im:3773,n:"Alba Martin Albariño",c:"ES",t:"Hvítvín",k:"white",b:1,s:"turt",a:12,v:"0,75 l",p:129.5,pr:["fiskur","skeljadjor"],dv:[],r:4.2,vo:18,no:"Turt vín við mineralskum dámi, sitrus og peru. Hóskar til ljósan fisk og skeljadjór."},
 {id:"01-137021",im:3827,n:"M. Chapoutier Banyuls",c:"FR",t:"Dessertvín",k:"sweet",b:3,s:"sott",a:16,v:"0,50 l",p:162,pr:["dessertir","ostur"],dv:[],r:4.5,vo:13,no:"Kraftmikið reytt dessertvín. Hóskar til sjokolátu og blámuost."},
 {id:"04-000130",im:2332,n:"Bollinger Special Cuvée",c:"FR",t:"Champagne",k:"sparkling",b:2,s:"turt",a:12,v:"0,75 l",p:482.5,pr:["fiskur","fordrykkir","skeljadjor"],dv:[],r:4.7,vo:21,no:"Silkibleytar bobblur við perum og valnøtum. Hóskar til fordrykk, fisk og skeljadjór."},
 {id:"02-121791",im:4175,n:"Maceration CF Orange",c:"FR",t:"Orangevín",k:"orange",b:2,s:"turt",a:13,v:"0,75 l",p:217,pr:["flogfenadur","ostur","svinakjot"],dv:[],r:4.1,vo:12,no:"Appelsinskal, hunang og turkað aprikos. Turt og fruktkent. Hóskar til vegetarrættir, svínakjøt og asiatiskan mat."}
];
const usingReal = !!(window.RUSAN_WINES && Array.isArray(window.RUSAN_WINES) && window.RUSAN_WINES.length);
const W = usingReal ? window.RUSAN_WINES : FALLBACK;

/* ---------- lookups ---------- */
const CN={US:"USA",FR:"Frakland",ES:"Spania",IT:"Italia",AR:"Argentina",DE:"Týskland",FO:"Føroyar",
 ZA:"Suðurafrika",PT:"Portugal",HU:"Ungarn",AU:"Avstralia",CL:"Kili",NZ:"Nýsæland",AT:"Eysturríki",
 GR:"Grikkaland",GE:"Georgia",RO:"Rumenia",SI:"Slovenia",HR:"Kroatia",MD:"Moldova",
 LB:"Libanon",IL:"Ísrael",CA:"Kanada",CH:"Sveis",UY:"Uruguay",BG:"Bulgaria",RS:"Serbia",MK:"Makedónia"};
function flag(cc){ if(!cc||cc.length!==2) return "🍷";
  try{return String.fromCodePoint(...[...cc.toUpperCase()].map(c=>0x1F1E6+c.charCodeAt(0)-65));}catch(e){return "🍷";} }
function origin(cc){return flag(cc)+" "+(CN[cc]||cc||"");}
const FOOD={fiskur:["🐟","Fiskur"],skeljadjor:["🦐","Skeljadjór"],flogfenadur:["🍗","Flogfenaður"],
 neytakjot:["🥩","Neytakjøt"],kalvakjot:["🍖","Kalvakjøt"],lambskjot:["🐑","Lambskjøt"],
 svinakjot:["🐖","Svínakjøt"],villinidjor:["🦌","Villinidjór"],ostur:["🧀","Ostur"],
 dessertir:["🍰","Dessertir"],fordrykkir:["🥂","Fordrykkir"]};
const BODY={1:"Lætt",2:"Miðal",3:"Kraftmikið"};
const SWEET={turt:"Turt",halvturt:"Hálvturt",sott:"Søtt"};
const SLAG={red:"Reyðvín",white:"Hvítvín",sparkling:"Brúsandi",sweet:"Søtt vín",orange:"Orangevín"};

/* ---------- note cleaning (so we never re-scrape) ---------- */
const _nc={};
function cleanNote(w){
  if(_nc[w.id]!=null) return _nc[w.id];
  let s=w.no||"";
  const ta=document.createElement('textarea'); ta.innerHTML=s; s=ta.value;   // decode &#250; etc.
  s=s.replace(/^\s*#+\s*/,"");                                               // drop leading "# "
  if(w.n && s.startsWith(w.n)) s=s.slice(w.n.length);                        // drop duplicated name
  s=s.replace(/^[\s:–-]+/,"").replace(/\s+/g," ").trim();
  _nc[w.id]=s; return s;
}

/* ---------- flavour tags from the note (our enrichment) ---------- */
const FLAV=[[/sól ?ber|blá ?ber|kirsu?ber|hind ?ber|jarð ?ber|trana ?ber|berum|berjasmakk|reyðum ber|sviskum|bromber|\bribs\b/i,"Ber"],
 [/eik/i,"Eik"],[/vanilj/i,"Vanilja"],[/krydd|nelikk|kanel|kardamum|piparkøk|timian|rosmarin|pipar/i,"Krydd"],
 [/sitrus|súrepl|sitrón|grape|melón|appelsin|banan|\bperu/i,"Sitrus"],[/hunang/i,"Hunang"],
 [/blóm|blomm|\brós/i,"Blómut"],[/royk/i,"Royktur"],[/sýr[au]|frísklig|frískur|frískum|frískari/i,"Frísk sýra"],
 [/mineralsk|steini|stein/i,"Mineralskt"],[/sjokolát|kaffi/i,"Kaffi · sjokoláta"],[/lakr/i,"Lakris"]];

/* ---------- state ---------- */
let step=0, onFav=false, helpOpen=false, sortMode='match';
const A={roynd:null,slag:[],matur:null,smakkur:[],fylla:null,sott:null,pris:null};

/* ============================================================ RENDER ============ */
function render(keepScroll){
  helpOpen=false;
  const inQuiz = step>=1 && step<=Q.length;
  fill.style.width = onFav?"100%":(step===0?"0%":(step>Q.length?"100%":(step/Q.length*100)+"%"));
  renderTop(inQuiz);
  if(onFav) renderFav();
  else if(step===0) renderIntro();
  else if(inQuiz) renderQ(step-1);
  else renderResults();
  if(!keepScroll) window.scrollTo({top:0,behavior:'instant'});
}

function renderTop(inQuiz){
  const favBtn=`<button class="favpill" onclick="openFav()">♥ Yndisvín<span class="cnt">${Object.keys(FAV).length}</span></button>`;

    topbar.innerHTML=`<div class="brandmark"><span class="glass">🍷</span> Smakkhjálpin</div><div class="topbar-actions">
      <button class="iconbtn" onclick="closeFav()" aria-label="Aftur">✕</button></div>`;
  } else if(inQuiz){
    topbar.innerHTML=`<span class="step-ix">Spurningur ${step} av ${Q.length}</span>
      <div class="topbar-actions"><button class="iconbtn" onclick="toggleHelp()" aria-label="Hjálp">?</button>
      <button class="iconbtn" onclick="home()" aria-label="Lat aftur">✕</button></div>`;
  } else {
    topbar.innerHTML=`<div class="brandmark"><span class="glass">🍷</span> Smakkhjálpin</div>
      <div class="topbar-actions">${favBtn}</div>`;
  }
}

function renderIntro(){

  main.innerHTML=`<section class="screen"><div class="hero">
    <h1 class="intro-title">Finn vínið,<br>ið hóskar til tín</h1>
    <p class="intro-sub">Svara nøkrum spurningum um mat og smakk. So leita vit í Rúsans skrá eftir vínum, ið hóska til tín, og síðani kanst tú fínstilla tilmælini.</p>
    <div class="facts">
      <div class="fact"><b>${W.length}</b><span>vín í skránni</span></div>
      <div class="fact"><b>${Q.length}</b><span>stuttir spurningar</span></div>

  </div></section>`;
}

function toggleHelp(){helpOpen=!helpOpen;const el=document.getElementById('help');if(el)el.classList.toggle('show',helpOpen);}

function renderQ(i){
  const q=Q[i], cur=A[q.key];
  let body;
  if(q.grid){
    body=`<div class="grid">`+q.opts.map(o=>{
      const lab=o.l||FOOD[o.v][1], gl=o.gl||(FOOD[o.v]?FOOD[o.v][0]:"");
      const sel=q.multi?(Array.isArray(cur)&&cur.includes(o.v)):(cur===o.v);
      const act=q.multi?`toggleMulti('${q.key}','${o.v}',this)`:`choose('${q.key}','${o.v}')`;
      return `<button class="cell ${sel?'on':''}" data-v="${o.v}" onclick="${act}"><span class="gl">${gl}</span>${lab}<span class="mini">✓</span></button>`;
    }).join('')+`</div>`+(q.multi?`<p class="multi-hint">Vel so nógvar tú vilt, ella eina.</p>`:``);
  } else {
    body=`<div class="opts">`+q.opts.map(o=>{
      const sw=q.swatch?(o.c==="conic"
        ? `<span class="swatch" style="background:conic-gradient(from 210deg,oklch(0.45 0.13 25),oklch(0.88 0.09 95),oklch(0.70 0.14 55),oklch(0.45 0.13 25))"></span>`
        : `<span class="swatch" style="background:${o.c}"></span>`):"";
      const sel=q.multi?(Array.isArray(cur)&&cur.includes(o.v)):(cur===o.v);
      const act=q.multi?`toggleMulti('${q.key}','${o.v}',this)`:`choose('${q.key}','${o.v}')`;
      return `<button class="opt ${sel?'on':''}" data-v="${o.v}" onclick="${act}">
        ${sw}<span class="col"><span class="lab">${o.l}</span>${o.d?`<span class="desc">${o.d}</span>`:''}</span>
        <span class="tick">✓</span></button>`;
    }).join('')+`</div>`+(q.multi?`<p class="multi-hint">Vel eitt ella fleiri.</p>`:``);
  }
  main.innerHTML=`<section class="screen">
    <div class="eyebrow">Spurningur ${i+1}</div>
    <h1>${q.title}</h1><p class="q-sub">${q.sub}</p>
    <div class="help-line" id="help">${q.help}</div>${body}</section>`;
  renderQuizActions(i);
}
function renderQuizActions(i){
  const last=i===Q.length-1;
  actions.className='actions show';
  actions.innerHTML=`<div class="row">
    <button class="linkbtn" ${i===0?'disabled':''} onclick="back()">Aftur</button>
    <button class="cta" onclick="next()">${last?'Vís úrslit':'Víðari'}</button>
    <button class="linkbtn" onclick="skip()">Stökk yvir</button></div>`;
}
function choose(key,val){A[key]=val;renderQ(step-1);}
function toggleMulti(key,val,el){
  if(!Array.isArray(A[key]))A[key]=[];
  const q=Qmap[key], ex=q&&q.exclusive, box=el.parentNode;
  if(ex&&val===ex){
    const wasOn=A[key].includes(ex);
    A[key]=wasOn?[]:[ex];
    [...box.children].forEach(b=>b.classList&&b.classList.remove('on'));
    if(!wasOn)el.classList.add('on');
    return;
  }
  if(ex){const ai=A[key].indexOf(ex);if(ai>=0){A[key].splice(ai,1);
    const ab=[...box.children].find(b=>b.dataset&&b.dataset.v===ex);if(ab)ab.classList.remove('on');}}
  const k=A[key].indexOf(val);
  if(k>=0){A[key].splice(k,1);el.classList.remove('on');}else{A[key].push(val);el.classList.add('on');}
}
function back(){if(step>1){step--;render();}}
function next(){step++; if(step>Q.length) enterResults(); else render();}
function skip(){const q=Q[step-1];A[q.key]=Array.isArray(q.skip)?[]:q.skip;next();}
function home(){step=0;render();}

/* ============================================================ MATCHING ============ */
function priceRange(){const o=Qmap.pris.opts.find(o=>o.v===A.pris);return o&&o.lo!=null?[o.lo,o.hi]:null;}
function passType(w){const sel=A.slag;if(!Array.isArray(sel)||!sel.length||sel.includes('any'))return true;
  return sel.some(t=> t==='sweet' ? (w.k==='sweet'||w.s==='sott') : w.k===t);}
function adj(a,b){const o=['turt','halvturt','sott'];return Math.abs(o.indexOf(a)-o.indexOf(b))===1;}
function isNatur(w){return /natúr|orange/i.test(w.t)||w.k==='orange';}

function score(w){
  let s=0,max=0;const reasons=[];
  const note=cleanNote(w), tags=flavAll(note);
  if(A.matur&&A.matur!=='none'){max+=50;
    if(w.pr.includes(A.matur)){s+=50;reasons.push({t:"Hóskar til "+FOOD[A.matur][1],ic:FOOD[A.matur][0]});}
    else if((w.dv||[]).includes(A.matur)){s+=32;reasons.push({t:"Nevnt til "+FOOD[A.matur][1],ic:FOOD[A.matur][0],soft:1});}}
  if(A.fylla&&A.fylla!=='any'){const pf=+A.fylla;max+=16;const d=Math.abs(w.b-pf);
    if(d===0){s+=16;reasons.push({t:BODY[pf]+" fylla",soft:1});}else if(d===1)s+=8;}
  if(A.sott&&A.sott!=='any'){max+=16;if(w.s===A.sott){s+=16;reasons.push({t:SWEET[A.sott],soft:1});}else if(adj(w.s,A.sott))s+=5;}
  (A.smakkur||[]).forEach(v=>{const o=Qmap.smakkur.opts.find(o=>o.v===v);max+=12;
    if(o&&o.tags.some(t=>tags.includes(t))){s+=12;reasons.push({t:o.l,ic:o.gl});}});
  const pct=max>0?Math.min(99,Math.round(s/max*100)):Math.round(w.r/5*100);
  // ranking-only adjustments (do not change displayed %)
  let rank=s+(w.r/5)*10;
  tags.forEach(t=>rank+=(REFINE.tags[t]||0)*6);
  rank+=(REFINE.type[w.k]||0)*6;
  if(liked.has(w.id)){rank+=45;reasons.push({t:"Líkist tínum vali",ic:"♥"});}
  if(A.roynd==='trygg'){rank+=(w.r-3.8)*10+(w.vo>40?6:0)-(isNatur(w)?14:0);}
  else if(A.roynd==='aevintyr'){rank+=(isNatur(w)?14:0)+(w.vo<15?6:0)-(w.vo>120?4:0)+(w.r>4.3?3:0);}
  return {pct,rank,reasons,note,tags};
}

function results(){
  const pr=priceRange();
  return W.filter(w=>passType(w)&&!disliked.has(w.id)&&(!pr||(w.p>=pr[0]&&w.p<pr[1])))
    .map(w=>({w,...score(w)})).sort((a,b)=>b.rank-a.rank);
}
function enterResults(){REFINE.tags={};REFINE.type={};liked.clear();disliked.clear();open.clear();sortMode='match';
  (A.smakkur||[]).forEach(v=>{const o=Qmap.smakkur.opts.find(o=>o.v===v);if(o)o.tags.forEach(t=>REFINE.tags[t]=(REFINE.tags[t]||0)+1);});
  if(Array.isArray(A.slag))A.slag.filter(t=>t!=='any').forEach(t=>REFINE.type[t]=(REFINE.type[t]||0)+1);
  step=Q.length+1;render();}

function profileChips(){
  const c=[];
  if(A.roynd&&A.roynd!=='any'){const o=Qmap.roynd.opts.find(o=>o.v===A.roynd);if(o)c.push(o.l);}
  if(Array.isArray(A.slag))A.slag.filter(t=>t!=='any').forEach(t=>c.push(SLAG[t]||t));
  if(A.fylla&&A.fylla!=='any')c.push(BODY[+A.fylla]);
  if(A.sott&&A.sott!=='any')c.push(SWEET[A.sott]);
  (A.smakkur||[]).forEach(v=>{const o=Qmap.smakkur.opts.find(o=>o.v===v);if(o)c.push(o.l);});
  if(A.matur&&A.matur!=='none')c.push(FOOD[A.matur][1]);
  return c;
}

const SORTS=[['match','Besta samsvar'],['plo','Prísur ↑'],['phi','Prísur ↓'],['rate','Hægsta meting']];
function sortBar(){return `<div class="sortbar">`+SORTS.map(([v,l])=>`<button class="sortpill ${sortMode===v?'on':''}" onclick="setSort('${v}')">${l}</button>`).join('')+`</div>`;}
function setSort(m){sortMode=m;render(true);}
function sortList(list){const a=list.slice();
  if(sortMode==='plo')a.sort((x,y)=>x.w.p-y.w.p);
  else if(sortMode==='phi')a.sort((x,y)=>y.w.p-x.w.p);
  else if(sortMode==='rate')a.sort((x,y)=>(+y.w.r)-(+x.w.r)||y.rank-x.rank);
  return a;}

function renderResults(){
  const list=sortList(results());
  const chips=profileChips();
  actions.className='actions show';
  actions.innerHTML=`<div class="row"><button class="cta full" onclick="restart()">Royn av nýggjum</button></div>`;
  const head=`<section class="screen"><div class="eyebrow">Tíni úrslit</div>
    <h1>${list.length?'Hetta mæla vit til':'Einki fullkomið samsvar'}</h1>
    ${chips.length?`<div class="profile">${chips.map(x=>`<span class="pchip">${x}</span>`).join('')}</div>`:''}`;
  if(!list.length){
    main.innerHTML=head+`<div class="empty"><div class="e-ic">🍇</div>
      <p>Einki vín samsvaraði við øll valini. Royn eitt breiðari úrval.</p></div></section>`;return;}
  const cards=list.slice(0,20).map((m,idx)=>card(m,idx)).join('');
  main.innerHTML=head
    +`<p class="rcount">${list.length} vín hóska til. Brúka 👍 og 👎 fyri at fínstilla.</p>`
    +sortBar()+cards+`</section>`;
}

function card(m,idx){
  const w=m.w, best=idx===0 && sortMode==='match';
  const stars="★".repeat(Math.round(w.r))+"☆".repeat(5-Math.round(w.r));
  const reasons=m.reasons.slice(0,4).map(r=>`<span class="reason ${r.soft?'soft':''}">${r.ic?r.ic+' ':''}${r.t}</span>`).join('');
  const tags=[`<span class="tag">${w.t}</span>`,`<span class="tag">${BODY[w.b]}</span>`,`<span class="tag">${SWEET[w.s]||''}</span>`]
    .concat(w.af?[`<span class="tag">Alkoholfrítt</span>`]:[])
    .concat(m.tags.slice(0,2).map(t=>`<span class="tag">${t}</span>`)).join('');
  const pairs=[...w.pr.map(p=>({p,d:0})),...(w.dv||[]).filter(p=>!w.pr.includes(p)).map(p=>({p,d:1}))]
    .map(o=>FOOD[o.p]?`<span class="pair ${o.d?'d':''}">${FOOD[o.p][0]} ${FOOD[o.p][1]}${o.d?' ·':''}</span>`:'').join('');
  return `<article class="wine ${best?'best':''}">
    ${best?'<span class="best-tag">Títt besta samsvar</span><br>':''}
    <button class="heart ${isFav(w.id)?'on':''}" onclick="toggleFav('${w.id}',this)" aria-label="Goym">♥</button>
    <div class="wtop">
      <div class="bottle"><img loading="lazy" src="https://rusan.fo/Images/Items/W50/${w.im}.jpg" alt="" onerror="this.parentNode.style.display='none'"></div>
      <div style="flex:1;min-width:0">
        <div class="match"><span class="pct">${m.pct}% samsvar</span><span class="meter"><i style="width:${m.pct}%"></i></span></div>
        <a class="wname" href="https://rusan.fo/ShopItem/VIN/0/${w.id}/STK" target="_blank" rel="noopener">${w.n}</a>
        <div class="worigin">${origin(w.c)} · ${w.a}% · ${w.v}</div>
      </div>
    </div>
    ${reasons?`<div class="reasons">${reasons}</div>`:''}
    <div class="tags">${tags}</div>
    <div class="wbar">
      <span class="price">${w.p.toLocaleString('da-DK',{minimumFractionDigits:2})} <s>kr</s></span>
      <span class="rate"><span class="stars">${stars}</span><br>${(+w.r).toFixed(1)} · ${w.vo} metingar</span>
    </div>
    <div class="refine">
      <button class="rbtn up" onclick="thumb('${w.id}',1)"><span class="x">👍</span> Meira av hesum slagnum</button>
      <button class="rbtn down" onclick="thumb('${w.id}',-1)"><span class="x">👎</span> Minni</button>
    </div>
    <button class="more" onclick="toggleDetail('${w.id}',this)">${open.has(w.id)?'Minni um vínið':'Meira um vínið'}</button>
    <div class="detail ${open.has(w.id)?'open':''}" id="d-${w.id}">
      ${m.note?`<p>${m.note}</p>`:'<p style="color:var(--faint)">Eingin smakkfrágreiðing.</p>'}
      ${pairs?`<div class="lbl">Hóskar til</div><div class="pair-row">${pairs}</div>`:''}
      ${m.tags.length?`<div class="lbl">Smakkmerki</div><div class="pair-row">${m.tags.map(t=>`<span class="pair">${t}</span>`).join('')}</div>`:''}
      <a class="shoplink" href="https://rusan.fo/ShopItem/VIN/0/${w.id}/STK" target="_blank" rel="noopener">Sí hjá Rúsuni →</a>
    </div>
  </article>`;
}

function thumb(id,dir){
  const w=W.find(x=>x.id===id); if(!w)return;
  const tags=flavAll(cleanNote(w));
  if(dir>0){liked.add(id);disliked.delete(id);tags.forEach(t=>REFINE.tags[t]=(REFINE.tags[t]||0)+1.5);REFINE.type[w.k]=(REFINE.type[w.k]||0)+1;
    toast("Vit leita eftir fleiri vínum sum hesum 👍");}
  else{disliked.add(id);liked.delete(id);tags.forEach(t=>REFINE.tags[t]=(REFINE.tags[t]||0)-1.5);REFINE.type[w.k]=(REFINE.type[w.k]||0)-1;
    toast("Tikið burtur. Vit tillaga úrslitini.");}
  render(true);
}
function toggleDetail(id,btn){
  const el=document.getElementById('d-'+id); if(!el)return;
  if(open.has(id)){open.delete(id);el.classList.remove('open');btn.textContent='Meira um vínið';}
  else{open.add(id);el.classList.add('open');btn.textContent='Minni um vínið';}
}
function restart(){step=0;A.roynd=A.matur=A.fylla=A.sott=A.pris=null;A.slag=[];A.smakkur=[];sortMode='match';
  REFINE.tags={};REFINE.type={};liked.clear();disliked.clear();open.clear();render();}

/* ============================================================ FAVOURITES ============ */
function openFav(){onFav=true;render();}
function closeFav(){onFav=false;render();}
function flavourLine(w){
  if(w.k==='sparkling')return "Til eina hátíðarliga løtu 🥂";
  if(w.k==='sweet'||w.s==='sott')return "Søtt at enda við 🍮";
  if(w.af)return "Gott uttan alkohol ✨";
  if(w.k==='red'&&w.b===3)return "Kraftmikið til kjøtið 🍷";
  if(w.k==='white')return "Frískt og lætt 🤍";
  if(w.k==='orange')return "Okkurt øðrvísi 🍊";
  return "Eitt gott val 🍷";
}
function toggleFav(id,el){
  if(isFav(id)){delete FAV[id];saveFav();if(onFav){render();return;}if(el)el.classList.remove('on');}
  else{FAV[id]={note:""};saveFav();if(el)el.classList.add('on');const w=W.find(x=>x.id===id);toast(w?"Goymt · "+flavourLine(w):"Goymt!");}
  renderTop(false);
}
function setNote(id,v){if(isFav(id)){FAV[id].note=v;saveFav();}}
function renderFav(){
  actions.className='actions';actions.innerHTML='';
  const ids=Object.keys(FAV);
  const head=`<section class="screen"><div class="favhead">
    <button class="iconbtn" onclick="closeFav()" aria-label="Aftur" style="margin-left:-8px">‹</button>
    <div><div class="eyebrow" style="margin:0">Tíni vín</div><h1 style="margin-top:2px">Yndisvín</h1></div></div>`;
  if(!ids.length){main.innerHTML=head+`<div class="empty"><div class="e-ic">🤍</div>
    <p>Eingi yndisvín enn.<br>Trýst á hjartað á einum víni og legg eina lítla heilsu afturat.</p></div></section>`;return;}
  const cards=ids.map(id=>{
    const w=W.find(x=>x.id===id);if(!w)return'';
    const tags=[`<span class="tag">${w.t}</span>`,`<span class="tag">${BODY[w.b]}</span>`,`<span class="tag">${SWEET[w.s]||''}</span>`].join('');
    const note=(FAV[id].note||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    return `<article class="favcard">
      <button class="heart on" onclick="toggleFav('${w.id}',this)" aria-label="Strika">♥</button>
      <div class="wtop"><div class="bottle"><img loading="lazy" src="https://rusan.fo/Images/Items/W50/${w.im}.jpg" alt="" onerror="this.parentNode.style.display='none'"></div>
        <div style="flex:1;min-width:0">
          <a class="wname" href="https://rusan.fo/ShopItem/VIN/0/${w.id}/STK" target="_blank" rel="noopener">${w.n}</a>
          <div class="worigin">${origin(w.c)} · ${w.p.toLocaleString('da-DK',{minimumFractionDigits:2})} kr</div>
          <div class="tags" style="margin-top:8px">${tags}</div></div></div>
      <div class="favmsg">${flavourLine(w)}</div>
      <div class="notelbl">Mín heilsa</div>
      <textarea class="note" rows="2" placeholder="Skriva eina lítla heilsu ella ein minnisseðil…" oninput="setNote('${w.id}',this.value)">${note}</textarea>
    </article>`;
  }).join('');
  main.innerHTML=head+`<p class="rcount">${ids.length} goymd vín</p>${cards}</section>`;
}

render();
</script>
</body>
</html>
